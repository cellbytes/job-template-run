[project]
name = "job-template-run"
version = "1.1.1"
description = "A Kubernetes controller for templated jobs and creating job runs"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "kopf>=1.44.6", "kubernetes>=36.0.3"]

[dependency-groups]
dev = [
    "ty==0.0.80",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "kubernetes-stubs-elephant-fork>=36.0.3",
    "commitizen>=4.18.1",
    "cz-changeup>=1.1.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# ty (https://docs.astral.sh/ty) - strictest possible configuration: every
# diagnostic rule is promoted to an error and warnings fail the run too. Any
# per-rule relaxation below carries the reason inline.
[tool.ruff]
# .claude/ vendors the Python LSP router, which is developer tooling shared
# across repos rather than project code; linting it here would let an edit in
# another repo fail this one's gate.
extend-exclude = ["./.claude/"]

[tool.ty.environment]
root = ["."]

[tool.ty.src]
# .claude/ holds the vendored Python LSP router, which is developer tooling
# shared across repos rather than project code; typechecking it here would let
# an edit in another repo fail this one's gate.
exclude = ["./.venv/", "./.claude/"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
# Fail the run on warnings as well, so nothing slips below "error".
error-on-warning = true

[tool.commitizen]
name = "cz_changeup"
version_provider = "pep621"
version_files = [
    "charts/job-template-run/Chart.yaml",
    "charts/job-template-run/values.yaml",
]
pre_bump_hooks = [
    'sed -i "/name = \"job-template-run\"/{n;s/version = \".*\"/version = \"$CZ_PRE_NEW_VERSION\"/}" uv.lock',
]
ignored_tag_formats = ["job-template-run-*"]

changeup_repo_base_url = "https://github.com/cellbytes/job-template-run"
