name: Release new version

on:
  workflow_run:
    workflows: ["Run tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
    
jobs:
  release:
    name: Release new version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Guard against releasing a commit that was not the one the triggering
      # test run validated: if main moved on since, skip and let the newer
      # commit's own test run trigger the release.
      - name: Verify HEAD is the tested commit
        id: guard
        run: |
          TESTED_SHA="${{ github.event.workflow_run.head_sha }}"
          if [[ "${{ github.event_name }}" == "workflow_run" \
                && "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo "HEAD moved past tested commit ${TESTED_SHA}; skipping release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen

      - name: Create bump and changelog
        id: cz
        if: steps.guard.outputs.proceed == 'true'
        run: |
          PREVIOUS_VERSION="$(uv run cz version --project)"
          uv run cz --no-raise 7,21 bump --yes \
            --changelog \
            --files-only \
            --git-output-to-stderr \
            --changelog-to-stdout \
            > charts/job-template-run/RELEASE_NOTES.md
          NEW_VERSION="$(uv run cz version --project)"

          if [[ "$PREVIOUS_VERSION" != "$NEW_VERSION" ]]; then
            sed -i '/Running hook/d' charts/job-template-run/RELEASE_NOTES.md
            git commit -am "bump: version ${PREVIOUS_VERSION} -> ${NEW_VERSION}"
            git push
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
            echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.cz.outputs.version-changed == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.cz.outputs.version-changed == 'true'
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.cz.outputs.version }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.cz.outputs.version-changed == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        if: steps.cz.outputs.version-changed == 'true'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        if: steps.cz.outputs.version-changed == 'true'
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NOTES_FILE: RELEASE_NOTES.md
          CR_RELEASE_NAME_TEMPLATE: "{{ .Version }}"
