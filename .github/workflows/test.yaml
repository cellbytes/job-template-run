name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.4

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.15
        with:
          release: v0.2.15

      - name: Install KinD
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          install_only: true

      - name: Lint Helm chart
        run: make lint

      - name: Create KinD cluster
        run: make kind

      - name: Build and load Docker image into kind cluster
        run: make build

      - name: Deploy Helm chart
        run: make helm-install

      - name: Run tests
        run: make test
