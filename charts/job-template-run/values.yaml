image:
  repository: ghcr.io/cellbytes/job-template-run
  tag: 1.1.1
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  # Grant the controller cluster-wide read access to Secrets so JobRuns can use
  # spec.callbackTokenSecretRef instead of a plaintext spec.callbackToken.
  # Opt-in because secret read access is a broad permission.
  allowCallbackTokenSecrets: false

# NetworkPolicy for the controller. Required in clusters with a default-deny
# policy, where the controller would otherwise be unable to reach DNS, the
# Kubernetes API, or the callback endpoint.
networkPolicy:
  enabled: false
  # TCP egress ports beyond DNS (53). 443 is the Kubernetes API server; 8000 is
  # the app's job-status callback endpoint. Override per environment (e.g. add
  # the live-server port used by the integration test in dev).
  egressPorts:
    - 443
    - 8000

# Container securityContext for the controller.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Pod securityContext for the controller.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

timerInterval: 30.0
